<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driftwood</title>
<meta name="description" content="A castaway's tale of the South Seas, 1846.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=VT323&family=Space+Mono:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css?v=20">
<link rel="stylesheet" href="css/screens.css?v=20">
<link rel="stylesheet" href="css/game.css?v=20">
<link rel="stylesheet" href="css/modal.css?v=20">
<link rel="stylesheet" href="css/themes.css?v=20">
</head>
<body>
<div id="defs"></div>

<section id="title-screen" class="screen">
  <div class="title-art" id="title-art"></div>
  <h1 class="title">Driftwood</h1>
  <p class="subtitle">a castaway's tale of the South Seas &middot; 1846</p>
  <div class="title-buttons">
    <button class="btn" id="btn-new"><span>begin</span></button>
    <button class="btn hidden" id="btn-continue"><span>continue</span></button>
    <button class="btn" id="btn-help"><span>how to play</span></button>
  </div>
  <p class="hint">best with sound &middot; progress is saved in this browser</p>
  <p class="hint hidden" id="carried">a castaway is at sea, bound for Valparaíso &middot; their tale goes on in Chapter Three</p>
  <div class="title-links">
    <button class="link" id="tgl-music-title">music: on</button>
    <button class="link" id="btn-style-title">visual style</button>
    <button class="link" id="btn-news">what's new</button>
    <button class="link hidden" id="btn-records">ship's log</button>
    <button class="link hidden" id="btn-prologue">the <i>Calliope</i>, 1826</button>
    <button class="link" id="btn-achievements">achievements</button>
  </div>
</section>

<section id="intro" class="screen hidden">
  <div id="intro-art" class="intro-art hidden"></div>
  <div id="intro-text"></div>
  <div class="intro-buttons">
    <div id="intro-choices" class="intro-choices"></div>
    <button class="btn" id="btn-intro-next"><span>&hellip;</span></button>
    <button class="link" id="btn-intro-skip">skip</button>
  </div>
</section>

<section id="game" class="screen hidden">
  <header class="topbar">
    <h1>Driftwood</h1>
    <div id="clock"></div>
    <div class="toggles">
      <button class="link" id="btn-style">style</button>
      <button class="link" id="btn-achievements-game">achievements</button>
      <button class="link" id="tgl-music">music: on</button>
      <button class="link" id="tgl-sfx">sound: on</button>
      <button class="link" id="btn-pause" title="Pause the game (P)">pause</button>
      <button class="link" id="btn-restart">restart</button>
    </div>
  </header>
  <div class="layout">
    <div class="col-log"><div id="log" aria-live="polite"></div></div>
    <div class="col-main">
      <div id="scene"></div>
      <nav id="tabs"></nav>
      <div id="panel"></div>
    </div>
    <aside class="col-side">
      <div id="status"></div>
      <div id="stores"></div>
    </aside>
  </div>
</section>

<footer class="credit">Made by <a href="https://orrin.uk" target="_blank" rel="noopener">Ben Orrin</a></footer>

<div id="toasts" aria-live="polite"></div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-card">
    <div id="modal-art"></div>
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div id="modal-choices"></div>
  </div>
</div>

<!-- Plain scripts, in dependency order, so the game runs straight from file://.
     The ?v= on every script and stylesheet makes browsers fetch a new release
     whole, never mixing it with files cached from the last; bump it on each release. -->
<script src="js/core.js?v=20"></script>

<script src="js/audio/synth.js?v=20"></script>
<script src="js/audio/ambience.js?v=20"></script>
<script src="js/audio/music.js?v=20"></script>
<script src="js/audio/effects.js?v=20"></script>

<script src="js/art/draw.js?v=20"></script>
<script src="js/art/nature.js?v=20"></script>
<script src="js/art/objects.js?v=20"></script>
<script src="js/art/camp.js?v=20"></script>
<script src="js/art/chart.js?v=20"></script>
<script src="js/art/scenes.js?v=20"></script>
<script src="js/art/foes.js?v=20"></script>

<script src="js/styles.js?v=20"></script>

<script src="js/game/util.js?v=20"></script>
<script src="js/game/data.js?v=20"></script>
<script src="js/game/state.js?v=20"></script>
<script src="js/game/achievements.js?v=20"></script>
<script src="js/game/ui.js?v=20"></script>
<script src="js/game/combat.js?v=20"></script>
<script src="js/game/endings.js?v=20"></script>
<script src="js/game/camp.js?v=20"></script>
<script src="js/game/story.js?v=20"></script>
<script src="js/game/locations.js?v=20"></script>
<script src="js/game/events.js?v=20"></script>
<script src="js/game/archipelago.js?v=20"></script>
<script src="js/game/sea.js?v=20"></script>
<script src="js/game/jem.js?v=20"></script>
<script src="js/game/islanders.js?v=20"></script>
<script src="js/game/perseverance.js?v=20"></script>
<script src="js/game/clock.js?v=20"></script>
<script src="js/game/render.js?v=20"></script>
<script src="js/game/prologue.js?v=20"></script>
<script src="js/game/main.js?v=20"></script>
</body>
</html>
